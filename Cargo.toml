[package]
name = "pomo-tui"
version = "0.3.0"
edition = "2021"
description = "ADHD-focused Pomodoro terminal application with Focus mode integration and task management"
authors = ["Patrick Priestley"]
license = "MIT"
repository = "https://github.com/PatrickPriestley/pomo-tui"
homepage = "https://github.com/PatrickPriestley/pomo-tui"
readme = "README.md"
keywords = ["pomodoro", "productivity", "tui", "terminal", "adhd", "focus"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
thiserror = "1.0"
rodio = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[features]
default = ["audio"]
audio = ["rodio"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pomo-tui"
path = "src/main.rs"

[metadata.cargo-machete]
# Ignore conditionally compiled audio dependencies
ignored = ["dirs", "serde", "serde_json", "rodio", "rusqlite", "chrono", "toml", "reqwest"]
